local_backend: true

backend:
  name: github
  repo: paulaenbaires/tailandiaentusmanos.com
  branch: main

site_url: https://tailandiaentusmanos.com
display_url: https://tailandiaentusmanos.com

media_folder: static/images/uploads
public_folder: /images/uploads

i18n:
  structure: multiple_folders
  locales: [es, en]
  default_locale: es

collections:
  - name: about
    label: "Sobre Mí / About"
    i18n: true
    files:
      - name: about
        label: "Sobre Mí / About"
        file: "content/about/index.md"
        i18n: true
        fields:
          - { label: "Title", name: "title", widget: "string", i18n: true }
          - { label: "Who I Am", name: "who_i_am", widget: "markdown", i18n: true }
          - { label: "Certification", name: "certification", widget: "markdown", i18n: true }
          - { label: "Experience", name: "experience", widget: "markdown", i18n: true }
          - { label: "What Defines Me", name: "defines_me", widget: "markdown", i18n: true }
          - { label: "Beyond Thai Massage", name: "beyond", widget: "markdown", i18n: true }
          - { label: "Photo", name: "photo", widget: "image", required: false, i18n: duplicate }

  - name: formations
    label: "Formaciones / Training"
    label_singular: "Formación / Training Program"
    folder: "content/formations"
    create: true
    slug: "{{slug}}"
    i18n: true
    fields:
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Description", name: "description", widget: "text", i18n: true }
      - { label: "Order", name: "order", widget: "number", value_type: "int", default: 0, i18n: duplicate }
      - { label: "Image", name: "image", widget: "image", required: false, i18n: duplicate }
      - label: "Category"
        name: "category"
        widget: "select"
        i18n: duplicate
        options:
          - { label: "Masaje Tailandés / Thai Massage", value: "thai-massage" }
          - { label: "Programa Propio / Own Program", value: "own-program" }
          - { label: "Técnicas Lanna / Lanna Techniques", value: "lanna" }
          - { label: "Staff Hotelero / Hotel Staff", value: "hotel-staff" }
          - { label: "Zen Shiatsu", value: "zen-shiatsu" }
      - label: "Levels"
        name: "levels"
        widget: "list"
        i18n: true
        required: false
        fields:
          - { label: "Level Name", name: "name", widget: "string", i18n: true }
          - { label: "Description", name: "description", widget: "text", i18n: true, required: false }
      - { label: "Body", name: "body", widget: "markdown", i18n: true, required: false }

  - name: sessions
    label: "Sesiones / Sessions"
    label_singular: "Sesión / Session"
    folder: "content/sessions"
    create: true
    slug: "{{slug}}"
    i18n: true
    fields:
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Description", name: "description", widget: "text", i18n: true }
      - { label: "Order", name: "order", widget: "number", value_type: "int", default: 0, i18n: duplicate }
      - { label: "Icon", name: "icon", widget: "string", required: false, i18n: duplicate, hint: "Lucide icon name (e.g. flower-2, bed-double)" }
      - { label: "Image", name: "image", widget: "image", required: false, i18n: duplicate }
      - { label: "Duration", name: "duration", widget: "string", required: false, i18n: true }
      - { label: "Body", name: "body", widget: "markdown", i18n: true, required: false }

  - name: travel
    label: "Viajes / Travel"
    label_singular: "Viaje / Trip"
    folder: "content/travel"
    create: true
    slug: "{{slug}}"
    i18n: true
    fields:
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Description", name: "description", widget: "text", i18n: true }
      - { label: "Order", name: "order", widget: "number", value_type: "int", default: 0, i18n: duplicate }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, i18n: duplicate }
      - { label: "Image", name: "image", widget: "image", required: false, i18n: duplicate }
      - label: "Type"
        name: "type"
        widget: "select"
        i18n: duplicate
        options:
          - { label: "Viaje Grupal / Group Trip", value: "group" }
          - { label: "A Medida / Custom", value: "custom" }
          - { label: "Diseño y Curaduría / Design & Curation", value: "design" }
      - { label: "Body", name: "body", widget: "markdown", i18n: true, required: false }

  - name: settings
    label: "Configuración / Settings"
    files:
      - name: contact
        label: "Contacto / Contact Info"
        file: "content/settings/contact.json"
        fields:
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "WhatsApp", name: "whatsapp", widget: "string", required: false }
          - { label: "Instagram URL", name: "instagram", widget: "string" }
          - { label: "Facebook URL", name: "facebook", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
